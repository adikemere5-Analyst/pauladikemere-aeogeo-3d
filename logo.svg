<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 140" width="620" height="140" role="img" aria-label="Paul Adikemere O. — AEO &amp; GEO Visibility Lab">
  <defs>
    
    <linearGradient id="brandGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="52%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.8" />
    </linearGradient>

    
    <linearGradient id="facetDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#101433" />
      <stop offset="100%" stop-color="#251252" />
    </linearGradient>

    
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0" />
    </linearGradient>

    
    <linearGradient id="outBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="1" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="1" />
    </linearGradient>

    
    <filter id="sharpGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <rect x="-20" y="46" width="70" height="7" fill="url(#beamGrad)" transform="rotate(-14, 15, 49.5)" opacity="0.7" />

  
  <g transform="translate(32, 14)" filter="url(#sharpGlow)">
    
    <path d="M5.6 3.8L48.5 22.6V68.8L5.6 50V3.8Z" fill="url(#facetDark)" stroke="#a855f7" stroke-width="1.5" />
    
    
    <path d="M48.5 22.6L91.4 3.8V50L48.5 68.8V22.6Z" fill="#090c24" stroke="#00f0ff" stroke-width="1.5" />
    
    
    <polygon points="5,3.8 48,22.6 91.4,3.8 48,-15" fill="#181b40" stroke="#10b981" stroke-width="1.5" />

    
    <path d="M46.5 33.2L50.5 31.5V67.5L46.5 69.2V33.2Z" fill="rgba(0, 240, 255, 0.3)" />
  </g>

  
  
  <path d="M120 52L156 36" stroke="url(#outBeamGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#sharpGlow)" />
  
  <path d="M120 74L156 90" stroke="url(#outBeamGrad)" stroke-width="4" stroke-linecap="round" opacity="0.8" filter="url(#sharpGlow)" />


  
  <g transform="translate(164, 58)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Inter, sans-serif" font-size="34" font-weight="900" letter-spacing="-1.1">
      PAUL ADIKEMERE O.
    </text>
    <text x="3" y="25" fill="url(#brandGlow)" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Inter, sans-serif" font-size="18" font-weight="800" letter-spacing="2.1">
      AEO &amp; GEO VISIBILITY LAB
    </text>
  </g>

  
  <rect x="167" y="95" width="198" height="4" rx="2" fill="url(#brandGlow)" opacity="0.6" />
</svg>
