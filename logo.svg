<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 130" width="600" height="130" role="img" aria-label="Paul Adikemere O. — AEO &amp; GEO Visibility Lab">
  <defs>
    <linearGradient id="beaconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="55%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131a3d" />
      <stop offset="100%" stop-color="#1e1548" />
    </linearGradient>
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291659" />
      <stop offset="100%" stop-color="#0f293a" />
    </linearGradient>
    <filter id="softNeon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <g transform="translate(22, 16)" filter="url(#softNeon)">
    
    <polygon points="48,10 82,48 48,88 14,48" fill="none" stroke="url(#beaconGrad)" stroke-width="2" opacity="0.45" />
    
    <polygon points="48,4 48,52 12,48" fill="url(#leftFacet)" stroke="#00f0ff" stroke-width="2" stroke-linejoin="round" />
    
    <polygon points="48,4 84,48 48,52" fill="url(#rightFacet)" stroke="#a855f7" stroke-width="2" stroke-linejoin="round" />
    
    <polygon points="12,48 48,52 48,92" fill="#0d122b" stroke="#00f0ff" stroke-width="2" stroke-linejoin="round" />
    
    <polygon points="84,48 48,92 48,52" fill="#181138" stroke="#10b981" stroke-width="2" stroke-linejoin="round" />
    
    <circle cx="48" cy="48" r="8" fill="#070816" stroke="#10b981" stroke-width="2.5" />
    <circle cx="48" cy="48" r="3.5" fill="#00f0ff" />
  </g>

  
  <text x="128" y="56" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Inter, sans-serif" font-size="30" font-weight="900" letter-spacing="-0.6">
    PAUL ADIKEMERE O.
  </text>
  <text x="129" y="84" fill="url(#beaconGrad)" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Inter, sans-serif" font-size="14.5" font-weight="800" letter-spacing="2">
    AEO &amp; GEO VISIBILITY LAB
  </text>
  <rect x="129" y="94" width="188" height="3.5" rx="1.75" fill="url(#beaconGrad)" />
</svg>
