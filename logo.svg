<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="540" height="120" role="img" aria-label="Paul Adikemere O. — AEO &amp; GEO Visibility Lab">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="52%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="cubeFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141b3d" />
      <stop offset="100%" stop-color="#2b1759" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  
  <g transform="translate(14, 14)" filter="url(#glow)">
    <polygon points="46,6 84,26 46,46 8,26" fill="#00f0ff" fill-opacity="0.22" stroke="url(#neonGrad)" stroke-width="2.5" stroke-linejoin="round" />
    <polygon points="8,26 46,46 46,88 8,68" fill="url(#cubeFace)" stroke="#00f0ff" stroke-width="2.2" stroke-linejoin="round" />
    <polygon points="84,26 46,46 46,88 84,68" fill="#181238" stroke="#a855f7" stroke-width="2.2" stroke-linejoin="round" />
    <circle cx="46" cy="46" r="8" fill="#10b981" />
    <circle cx="46" cy="46" r="3.5" fill="#070816" />
  </g>

  
  <text x="116" y="54" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Inter, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">
    PAUL ADIKEMERE O.
  </text>
  <text x="117" y="83" fill="url(#neonGrad)" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Inter, sans-serif" font-size="14.5" font-weight="800" letter-spacing="1.6">
    AEO &amp; GEO VISIBILITY LAB
  </text>
  <rect x="117" y="93" width="168" height="3" rx="1.5" fill="url(#neonGrad)" />
</svg>
